; SteelSeries GameDAC chat output path (PCM device 0).
; See steelseries-gamedac-usb-audio.conf.
;
; Chat and game are separate USB audio functions, each with its own
; "PCM Playback Switch", so the card has two PCM elements. The index is
; spelled out so this path binds to the chat one (index 0).

[General]
description-key = analog-output-headphones
priority = 50

[Element PCM,0]
switch = mute
volume = merge
override-map.1 = all
override-map.2 = all-left,all-right
