; SteelSeries GameDAC game output path (PCM device 1).
; See steelseries-gamedac-usb-audio.conf.

[General]
description-key = analog-output-headphones
priority = 99

[Element PCM,1]
switch = mute
volume = merge
override-map.1 = all
override-map.2 = all-left,all-right
