; Audeze Maxwell wireless dongle.
;
; Like the headsets in usb-gaming-headset.conf, this one splits playback into a
; chat stream and a game stream so the two can be mixed separately. Unlike
; them, it gives each stream a real hardware volume control:
;
;   Chat  interface 1, "Chat-Audeze Maxwell"  Feature Unit 2   hw:%f,0,0  PCM,0
;   Game  interface 4, "Game-Audeze Maxwell"  Feature Unit 10  hw:%f,1,0  PCM,1
;   Mic   interface 1                         Feature Unit 6   hw:%f,0,0  Mic,0
;
; usb-gaming-headset.conf does not fit. Its output path hardcodes [Element
; PCM,1] and both of its output mappings share that path, so on this card the
; chat sink streams to hw:%f,0,0 while writing the game element. Its input path
; looks for [Element Headset], which does not exist here.
;
; The headset presents the same layout when it is plugged in over USB instead
; of going through the dongle, so it uses this file too. Without it the card
; falls back to default.conf, which exposes only hw:%f,0,0 as a single stereo
; sink and leaves the game stream unreachable.
;
; Works with:
; Audeze Maxwell Dongle
; Audeze Maxwell XBOX Dongle
; Audeze Maxwell XBOX Headset (direct USB)
;
; See default.conf for an explanation on the directives used here.

[General]
auto-profiles = yes

[Mapping stereo-chat]
description-key = gaming-headset-chat
device-strings = hw:%f,0,0
channel-map = left,right
paths-output = audeze-maxwell-output-chat
direction = output
intended-roles = phone

[Mapping stereo-game]
description-key = gaming-headset-game
device-strings = hw:%f,1,0
channel-map = left,right
paths-output = audeze-maxwell-output-game
direction = output

[Mapping mic]
description-key = gaming-headset-chat
device-strings = hw:%f,0,0
channel-map = mono
paths-input = audeze-maxwell-input
direction = input

[Profile output:stereo-game+output:stereo-chat+input:mic]
output-mappings = stereo-game stereo-chat
input-mappings = mic
priority = 5100
