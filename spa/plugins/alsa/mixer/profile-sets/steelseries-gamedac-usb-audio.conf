; SteelSeries GameDAC (1038:1282), used with the Arctis Pro + GameDAC.
;
; The GameDAC exposes two USB audio functions. PCM device 0 is the chat
; device (stereo output, mono microphone input). PCM device 1 is the game
; device; its only streaming format is 6 channels (FL FR FC LFE RL RR),
; the GameDAC does its own virtual surround processing. It cannot be
; opened as stereo, which is why usb-gaming-headset.conf does not work.
;
; This is the GameDAC in PC mode. In Hi-Res mode it re-enumerates as
; 1038:1283 with a single stereo device (up to 96 kHz/24 bit) and no game
; device; default.conf handles that, so it has no rule.
;
; Each device has its own mute switch: "PCM",0 for chat and "PCM",1 for
; game. Neither exposes a volume control over USB; the GameDAC's volume
; wheel and ChatMix (game/chat balance) act inside the DAC and are not
; visible to ALSA, so the sink volumes are software volumes.
;
; See default.conf for an explanation on the directives used here.

[General]
auto-profiles = yes

[Mapping analog-chat]
description-key = gaming-headset-chat
device-strings = hw:%f,0,0
channel-map = left,right
paths-output = steelseries-gamedac-output-chat
direction = output
intended-roles = phone

[Mapping mono-chat]
description-key = gaming-headset-chat
device-strings = hw:%f,0,0
channel-map = mono
paths-input = analog-input-mic
direction = input
intended-roles = phone

[Mapping surround51-game]
description-key = gaming-headset-game
device-strings = hw:%f,1,0
channel-map = front-left,front-right,front-center,lfe,rear-left,rear-right
paths-output = steelseries-gamedac-output-game
direction = output

[Profile output:analog-chat+output:surround51-game+input:mono-chat]
output-mappings = analog-chat surround51-game
input-mappings = mono-chat
priority = 5200
